# Render Blueprint for the Farm Doctor backend.
#
# The backend lives in backend/, set via rootDir — Render honours it for both the
# build and start steps (it picks up backend/.nvmrc). So the commands are plain
# npm install / npm start. The earlier ERR_MODULE_NOT_FOUND was a misconfigured
# Build Command ("yarn start", which runs the server without installing deps),
# not a root-directory problem.
#
# Secrets (ANTHROPIC_API_KEY, SUPABASE_*, AWS_*) are NOT stored here — set them in
# the Render dashboard (sync: false keeps them out of the repo).
services:
  - type: web
    name: farm-doctor-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VISION_MODEL
        value: claude-haiku-4-5-20251001
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: AWS_REGION
        value: us-east-1
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
