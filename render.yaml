# Render Blueprint for the Farm Doctor backend.
#
# The backend lives in backend/. We `cd backend` in BOTH commands rather than
# relying on the Root Directory setting, because Render's root dir doesn't always
# apply to the build step — which left backend's deps (dotenv, express, …)
# uninstalled and crashed the server with ERR_MODULE_NOT_FOUND.
#
# Secrets (ANTHROPIC_API_KEY, SUPABASE_*, AWS_*) are NOT stored here — set them in
# the Render dashboard (sync: false keeps them out of the repo).
services:
  - type: web
    name: farm-doctor-api
    runtime: node
    plan: free
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VISION_MODEL
        value: claude-haiku-4-5-20251001
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: AWS_REGION
        value: us-east-1
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
