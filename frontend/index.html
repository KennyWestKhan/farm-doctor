<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2e7d54" />
    <meta name="description" content="AI crop disease diagnosis in Twi — works offline." />

    <!-- iOS standalone behaviour (no manifest launch screen on iOS) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Farm Doctor" />
    <meta name="mobile-web-app-capable" content="yes" />

    <title>Farm Doctor Ghana</title>

    <!-- Static splash: paints instantly on first byte, before any JS/fonts load,
         then fades out once React signals it is ready (window.__hideSplash). -->
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: linear-gradient(160deg, #3a9568 0%, #2e7d54 45%, #1f5e3f 100%);
        color: #fff;
        font-family: system-ui, -apple-system, sans-serif;
        opacity: 1;
        transition: opacity 0.4s ease;
      }
      #splash.hide { opacity: 0; pointer-events: none; }
      #splash img { width: 96px; height: 96px; filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.25)); }
      #splash .name { font-size: 28px; font-weight: 800; letter-spacing: -0.02em; }
      #splash .dots { display: flex; gap: 7px; margin-top: 6px; }
      #splash .dots span {
        width: 9px; height: 9px; border-radius: 50%;
        background: rgba(255, 255, 255, 0.85);
        animation: splashpulse 1s ease-in-out infinite;
      }
      #splash .dots span:nth-child(2) { animation-delay: 0.15s; }
      #splash .dots span:nth-child(3) { animation-delay: 0.3s; }
      @keyframes splashpulse {
        0%, 100% { opacity: 0.3; transform: scale(0.8); }
        50% { opacity: 1; transform: scale(1); }
      }
    </style>
  </head>
  <body>
    <div id="splash">
      <img src="/favicon.svg" alt="" />
      <div class="name">Farm Doctor</div>
      <div class="dots"><span></span><span></span><span></span></div>
    </div>

    <div id="root"></div>

    <script>
      // Fade out and remove the splash. Called by main.jsx once the app paints;
      // a fallback timer ensures it never gets stuck if that call is missed.
      window.__hideSplash = function () {
        var s = document.getElementById('splash');
        if (!s || s.classList.contains('hide')) return;
        s.classList.add('hide');
        setTimeout(function () { s.remove(); }, 450);
      };
      setTimeout(function () { window.__hideSplash(); }, 8000);
    </script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
